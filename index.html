<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暗記アプリ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/door.png">
    
    <link rel="stylesheet" href="style.css?v=swipeonly">
</head>
<body>

<div id="app-container">
    <div id="home-screen">
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px;">
            <button id="dark-toggle-btn" style="padding: 8px 16px; border-radius: 20px; border: 2px solid #ccc; background: #fff; font-weight: bold; cursor: pointer;" onclick="toggleDarkMode()">
                🌙 ダーク
            </button>
            <button id="vibe-toggle-btn" style="padding: 8px 16px; border-radius: 20px; border: 2px solid #ccc; background: #fff; font-weight: bold; cursor: pointer;" onclick="toggleVibration()">
                📳 振動: ON
            </button>
        </div>

        <h1 class="main-title" style="margin-top: 0;">暗記</h1>

        <div id="resume-container" class="hidden" style="margin-bottom: 20px;">
            <button id="resume-btn" class="menu-btn" style="width: 100%; background-color: #4CAF50; color: white; border-color: #388E3C; font-size: 18px;" onclick="resumeQuiz()">
                ▶️ 続きから再開
            </button>
        </div>
        
        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;">
            <button id="normal-mode-btn" class="menu-btn" style="width: 45%;" onclick="setReviewMode(false)">通常モード</button>
            <button id="review-mode-btn" class="menu-btn" style="width: 45%;" onclick="setReviewMode(true)">復習モード🔥</button>
        </div>

        <div class="menu-grid">
            <button class="menu-btn" onclick="selectGenre('flag')">州都🇺🇸</button>
            <button class="menu-btn" onclick="selectGenre('constellation')">８８星座🌌</button>
            <button class="menu-btn" onclick="selectGenre('worldflag')">国旗🌎</button>
            <button class="menu-btn" onclick="selectGenre('element')">元素記号🧪</button>
            <button class="menu-btn" onclick="selectGenre('mountain')">8000m峰🏔️</button>
            <button class="menu-btn" onclick="selectGenre('olympic')">五輪開催地🏅</button>
            <button class="menu-btn" onclick="selectGenre('morse')">モールス信号📟</button>
            <button class="menu-btn" onclick="selectGenre('president')">大統領🇺🇸</button>
            <button class="menu-btn" onclick="selectGenre('yamanote')">山手線🚃</button>
            <button class="menu-btn" onclick="selectGenre('capital')">首都🏛️</button>
        </div>
    </div>

    <div id="subgenre-screen" class="hidden">
        <h2 class="result-title">地域を選択🌎</h2>
        <div class="menu-grid" style="margin-top: 30px;">
            <button class="menu-btn" onclick="selectSubGenre('asia')">アジア</button>
            <button class="menu-btn" onclick="selectSubGenre('europe')">ヨーロッパ</button>
            <button class="menu-btn" onclick="selectSubGenre('africa')">アフリカ</button>
            <button class="menu-btn" onclick="selectSubGenre('north_america')">北アメリカ</button>
            <button class="menu-btn" onclick="selectSubGenre('south_america')">南アメリカ</button>
            <button class="menu-btn" onclick="selectSubGenre('oceania')">オセアニア</button>
        </div>
        <button class="menu-btn" style="margin-top: 20px; width: 100%; background-color: #2196F3; color: white; border-color: #1976D2;" onclick="selectSubGenre('all')">
            ぜんぶ（世界ランダム）
        </button>
        <button class="menu-btn" style="margin-top: 20px; width: 100%;" onclick="showHome()">ホームに戻る</button>
    </div>

    <div id="review-start-screen" class="hidden" style="display: flex; flex-direction: column; align-items: center; width: 100%; padding-top: 30px;">
        <h2 class="result-title">復習モード🔥</h2>
        <p id="review-count-text" style="font-size: 24px; font-weight: bold; margin: 20px 0; color: #d32f2f;">対象：0問</p>
        <div class="menu-grid" style="width: 100%; margin-top: 20px;">
            <button class="menu-btn" style="background-color: #ff9800; color: #fff; border:none;" onclick="startReviewQuiz()">スタート！</button>
            <button class="menu-btn" style="background-color: #f44336; color: #fff; border:none;" onclick="resetReviewList()">リセット🗑️</button>
        </div>
        <button class="menu-btn" style="margin-top: 40px; width: 100%;" onclick="showHome()">ホームに戻る</button>
    </div>

    <div id="mode-screen" class="hidden">
        <h2 class="result-title">出題形式</h2>
        <div class="menu-grid" style="margin-top: 30px;">
            <button class="menu-btn" onclick="startQuizMode(false)">順番通り<br><span style="font-size:12px; font-weight:normal;">(番号・高さ・年代順など)</span></button>
            <button class="menu-btn" onclick="startQuizMode(true)">ランダム<br><span style="font-size:12px; font-weight:normal;">(シャッフルテスト)</span></button>
        </div>
        <button class="menu-btn" style="margin-top: 40px; width: 100%;" onclick="showHome()">ホームに戻る</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-container">
            <div id="progress-fill" class="progress-fill-bar"></div>
        </div>

        <div class="quiz-header">
            <div id="counter" class="counter-box">C</div>
            <button id="exit-btn" onclick="showHome()">
                <img src="https://img.icons8.com/fluency/48/door.png" alt="home"/>
            </button>
        </div>
        <div id="question-label" class="question-label-box">B</div> 
        <div id="problem-area" class="problem-area-box" onclick="handleTouch()">
            <div id="state-name-display">E</div> 
            <div class="image-container">
                <img id="question-img" src="" class="hidden"> 
                <div id="fallback-text" class="hidden">A</div> 
            </div>
            <div id="answer-text" class="hidden">D</div> 
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 class="result-title">復習リスト📝</h2>
        <div id="wrong-list" class="wrong-list-box"></div>
        <button id="retest-btn" class="menu-btn hidden" style="margin-top: 20px; width: 100%; background-color: #ff8c00; color: #fff; border: none; font-size: 18px;" onclick="startRetest()">
            間違えた問題だけで再テスト！
        </button>
        <button class="menu-btn" style="margin-top: 10px; width: 100%;" onclick="showHome()">ホームに戻る</button>
    </div>
</div>

<script src="data.js?v=swipeonly"></script>
<script src="script.js?v=swipeonly"></script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').then(function(registration) {
                console.log('アプリ化成功！');
            });
        });
    }
</script>
</body>
</html>
